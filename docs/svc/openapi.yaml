components:
    schemas:
        AddPackageRequest:
            properties:
                ecosystem:
                    type: string
                identifier:
                    type: string
            type: object
        AddPackageResponse:
            properties:
                already_exists:
                    type: boolean
                ecosystem:
                    type: string
                id:
                    format: int32
                    type: integer
                identifier:
                    type: string
            type: object
        CreatePackageRequest:
            properties:
                ecosystem:
                    type: string
                identifier:
                    type: string
            type: object
        CreatePackageResponse:
            properties:
                already_exists:
                    type: boolean
                ecosystem:
                    type: string
                id:
                    format: int32
                    type: integer
                identifier:
                    type: string
            type: object
        DependencyListItem:
            properties:
                behavior_passed:
                    nullable: true
                    type: boolean
                dependency_type:
                    type: string
                ecosystem:
                    type: string
                has_attestation:
                    nullable: true
                    type: boolean
                has_oss_rebuild:
                    nullable: true
                    type: boolean
                id:
                    format: int32
                    type: integer
                identifier:
                    type: string
                version:
                    type: string
                version_constraint:
                    type: string
            type: object
        DependencyListResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/DependencyListItem'
                    type: array
            type: object
        Ecosystem:
            enum:
                - npm
                - go
                - cargo
                - pypi
            type: string
        ErrorResponse:
            properties:
                error:
                    type: string
            required:
                - error
            type: object
        GetProjectResponse:
            properties:
                created_at:
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                source_type:
                    type: string
                status:
                    type: string
                updated_at:
                    type: string
            type: object
        ListVersionsResponse:
            properties:
                ecosystem:
                    type: string
                identifier:
                    type: string
                latest_version:
                    nullable: true
                    type: string
                versions:
                    items:
                        type: string
                    type: array
            type: object
        PackageListItem:
            properties:
                ecosystem:
                    type: string
                id:
                    format: int32
                    type: integer
                identifier:
                    type: string
                latest_version:
                    nullable: true
                    type: string
            type: object
        PackageListResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/PackageListItem'
                    type: array
            type: object
        PackageSummary:
            properties:
                ecosystem:
                    $ref: '#/components/schemas/Ecosystem'
                identifier:
                    type: string
                latest_version:
                    type: string
            type: object
        PackageVersion:
            properties:
                ecosystem:
                    $ref: '#/components/schemas/Ecosystem'
                identifier:
                    type: string
                latest:
                    type: boolean
                maintainer_notes:
                    type: string
                source:
                    $ref: '#/components/schemas/Source'
                tags:
                    items:
                        $ref: '#/components/schemas/TagInfo'
                    type: array
                trust_level:
                    format: int32
                    type: integer
                version:
                    type: string
            type: object
        PkgVtype:
            enum:
                - integer
                - boolean
                - float
            type: string
        ProjectListItem:
            properties:
                created_at:
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                source_type:
                    type: string
                status:
                    type: string
                updated_at:
                    type: string
            type: object
        ProjectListResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ProjectListItem'
                    type: array
            type: object
        ProjectSummaryResponse:
            properties:
                project_id:
                    type: integer
                summary:
                    items:
                        $ref: '#/components/schemas/SummaryRow'
                    type: array
            type: object
        RegisterReproducibleBuildRequest:
            properties:
                ecosystem:
                    type: string
                identifier:
                    type: string
                tarball:
                    type: string
                version:
                    type: string
            type: object
        RegisterReproducibleBuildResponse:
            properties:
                package_version_id:
                    format: int32
                    type: integer
            type: object
        Result:
            properties:
                ecosystem:
                    type: string
                identifier:
                    type: string
                oss_rebuild:
                    type: boolean
                upstream_attestation:
                    type: boolean
                version:
                    type: string
            type: object
        ReviewQueueItem:
            properties:
                ecosystem:
                    type: string
                identifier:
                    type: string
                is_latest:
                    type: boolean
                manually_approved:
                    nullable: true
                    type: boolean
                review_comment:
                    nullable: true
                    type: string
                version:
                    type: string
            type: object
        ReviewQueueResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ReviewQueueItem'
                    type: array
            type: object
        ReviewStatusResponse:
            properties:
                manually_approved:
                    nullable: true
                    type: boolean
                review_comment:
                    nullable: true
                    type: string
            type: object
        SearchResult:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/PackageSummary'
                    type: array
                page:
                    format: int32
                    type: integer
                page_size:
                    format: int32
                    type: integer
                total_count:
                    format: int64
                    type: integer
            type: object
        Source:
            properties:
                commit:
                    type: string
                tag:
                    type: string
                url:
                    type: string
            type: object
        SubmitReviewRequest:
            properties:
                approved:
                    type: boolean
                comment:
                    type: string
            type: object
        SummaryRow:
            properties:
                behavior_passed:
                    format: int32
                    type: integer
                dependency_type:
                    type: string
                has_attestation:
                    format: int32
                    type: integer
                has_oss_rebuild:
                    format: int32
                    type: integer
                total:
                    format: int32
                    type: integer
            type: object
        TagError:
            properties:
                Err: {}
                Kind:
                    type: integer
                Tag:
                    type: string
            type: object
        TagInfo:
            properties:
                data:
                    format: byte
                    type: string
                label:
                    type: string
                value_type:
                    $ref: '#/components/schemas/PkgVtype'
            type: object
        TaskListItem:
            properties:
                completed_at:
                    nullable: true
                    type: string
                created_at:
                    type: string
                ecosystem:
                    type: string
                failure_reason:
                    nullable: true
                    type: string
                has_artifact:
                    type: boolean
                id:
                    format: int32
                    type: integer
                identifier:
                    type: string
                source:
                    type: string
                started_at:
                    nullable: true
                    type: string
                status:
                    type: string
                version:
                    type: string
            type: object
        TaskListResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/TaskListItem'
                    type: array
            type: object
        TriggerScanRequest:
            properties:
                version:
                    type: string
            type: object
        TriggerScanResponse:
            properties:
                ecosystem:
                    type: string
                identifier:
                    type: string
                status:
                    type: string
                task_id:
                    format: int32
                    type: integer
                version:
                    type: string
            type: object
        UploadProjectRequest:
            properties:
                file:
                    type: string
                name:
                    type: string
            type: object
        UploadProjectResponse:
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                status:
                    type: string
            type: object
        VersionListResult:
            properties:
                ecosystem:
                    $ref: '#/components/schemas/Ecosystem'
                identifier:
                    type: string
                versions:
                    items:
                        $ref: '#/components/schemas/VersionSummary'
                    type: array
            type: object
        VersionSummary:
            properties:
                behavior_passed:
                    nullable: true
                    type: boolean
                has_attestation:
                    type: boolean
                has_oss_rebuild:
                    type: boolean
                latest:
                    type: boolean
                manually_approved:
                    nullable: true
                    type: boolean
                review_comment:
                    nullable: true
                    type: string
                source:
                    $ref: '#/components/schemas/Source'
                version:
                    type: string
            type: object
info:
    description: API for querying package information and metadata
    title: Secure Package Registry API
    version: 1.0.0
openapi: 3.0.3
paths:
    /api/v1/admin/packages:
        get:
            description: List all watched packages for a given ecosystem.
            operationId: adminListPackages
            parameters:
                - description: Ecosystem to list packages for
                  in: query
                  name: ecosystem
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PackageListResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: List watched packages
            tags:
                - Admin
        post:
            description: Create a new package in the watch list and publish a package requested event.
            operationId: adminAddPackage
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddPackageRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddPackageResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: Add package to watch list
            tags:
                - Admin
    /api/v1/admin/packages/{ecosystem}/{identifier}/behavior:
        get:
            description: Return the pre-computed deduped behavioral analysis tree for a specific package version.
            operationId: adminGetBehavior
            parameters:
                - in: path
                  name: ecosystem
                  required: true
                  schema:
                    type: string
                - in: path
                  name: identifier
                  required: true
                  schema:
                    type: string
                - description: Package version to retrieve behavior for
                  in: query
                  name: version
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                format: binary
                                type: string
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: Get behavioral analysis (deduped)
            tags:
                - Admin
    /api/v1/admin/packages/{ecosystem}/{identifier}/behavior/raw:
        get:
            description: Return the raw (non-deduped) behavioral analysis tree for a specific package version.
            operationId: adminGetBehaviorRaw
            parameters:
                - in: path
                  name: ecosystem
                  required: true
                  schema:
                    type: string
                - in: path
                  name: identifier
                  required: true
                  schema:
                    type: string
                - description: Package version to retrieve behavior for
                  in: query
                  name: version
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                format: binary
                                type: string
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: Get behavioral analysis (raw)
            tags:
                - Admin
    /api/v1/admin/packages/{ecosystem}/{identifier}/scan:
        post:
            description: Trigger a behavioral analysis scan for a package version. Defaults to the latest version if none is specified.
            operationId: adminTriggerScan
            parameters:
                - in: path
                  name: ecosystem
                  required: true
                  schema:
                    type: string
                - in: path
                  name: identifier
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TriggerScanRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TriggerScanResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: Trigger behavioral analysis scan
            tags:
                - Admin
    /api/v1/admin/packages/{ecosystem}/{identifier}/versions:
        get:
            description: List all known versions for a package.
            operationId: adminListVersions
            parameters:
                - in: path
                  name: ecosystem
                  required: true
                  schema:
                    type: string
                - in: path
                  name: identifier
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListVersionsResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: List package versions
            tags:
                - Admin
    /api/v1/admin/packages/{ecosystem}/{identifier}/versions/{version}/review:
        get:
            description: Get the current manual review status and comment for a specific package version.
            operationId: adminGetReviewStatus
            parameters:
                - in: path
                  name: ecosystem
                  required: true
                  schema:
                    type: string
                - in: path
                  name: identifier
                  required: true
                  schema:
                    type: string
                - in: path
                  name: version
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReviewStatusResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: Get review status
            tags:
                - Admin
        post:
            description: Submit a manual review (approve/reject with comment) for a package version.
            operationId: adminSubmitReview
            parameters:
                - in: path
                  name: ecosystem
                  required: true
                  schema:
                    type: string
                - in: path
                  name: identifier
                  required: true
                  schema:
                    type: string
                - in: path
                  name: version
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SubmitReviewRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReviewStatusResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: Submit review
            tags:
                - Admin
    /api/v1/admin/review:
        get:
            description: List package versions that failed behavioral analysis, with their manual review status.
            operationId: adminListReviewQueue
            parameters:
                - description: Filter by ecosystem
                  in: query
                  name: ecosystem
                  schema:
                    type: string
                - description: 'Filter by review status: unreviewed, approved, rejected, or all (default)'
                  in: query
                  name: status
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReviewQueueResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: List review queue
            tags:
                - Admin
    /api/v1/admin/tasks:
        get:
            description: List collection tasks with package context, optionally filtered by ecosystem.
            operationId: adminListTasks
            parameters:
                - description: Filter by ecosystem
                  in: query
                  name: ecosystem
                  schema:
                    type: string
                - description: Page number (default 1)
                  in: query
                  name: page
                  schema:
                    type: string
                - description: Page size (default 50, max 100)
                  in: query
                  name: page_size
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TaskListResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: List collection tasks
            tags:
                - Admin
    /api/v1/admin/tasks/{taskID}/artifact:
        get:
            description: Stream the behavioral analysis artifact (.jsonl) for a completed collection task.
            operationId: adminDownloadArtifact
            parameters:
                - in: path
                  name: taskID
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/x-ndjson:
                            schema:
                                format: binary
                                type: string
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: Download task artifact
            tags:
                - Admin
    /api/v1/internal/packages:
        post:
            description: Register a package from an internal service. Returns existing package if already created.
            operationId: internalCreatePackage
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreatePackageRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreatePackageResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: Create package (internal)
            tags:
                - Internal
    /api/v1/internal/reproducible-builds:
        post:
            description: Validate that a package version exists, tag it as reproducible, and upload the artifact to the registry.
            operationId: internalRegisterReproducibleBuild
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterReproducibleBuildRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RegisterReproducibleBuildResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            summary: Register reproducible build (internal)
            tags:
                - Internal
    /api/v1/projects:
        get:
            description: List all projects belonging to the authenticated user.
            operationId: listProjects
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectListResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            security:
                - BearerAuth: []
            summary: List projects
            tags:
                - Projects
        post:
            description: Create or replace a project's dependency set from a lockfile or package manifest.
            operationId: uploadProject
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UploadProjectRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UploadProjectResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unauthorized
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Internal Server Error
            security:
                - BearerAuth: []
            summary: Upload project
            tags:
                - Projects
    /api/v1/projects/{projectID}:
        delete:
            description: Delete a project and all its dependencies.
            operationId: deleteProject
            parameters:
                - in: path
                  name: projectID
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
