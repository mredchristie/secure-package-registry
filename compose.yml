services:
  rabbitmq:
    image: docker.io/rabbitmq:4-management
    ports:
      - "127.0.0.1:7001:15672"
      - "127.0.0.1:5672:5672" # For testing purposes. Comment out in prod.
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_SECRET:-admin}"
  gitea:
    image: docker.gitea.com/gitea:1.25.4
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea_db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
      - GITEA__security__INSTALL_LOCK=true
      - GITEA_CUSTOM=/data/gitea/custom

    volumes:
      # Uncomment when necessary. No persistence necessary for testing phase
      # - ./data/gitea:/data:Z
      - ./infra/gitea-custom/:/data/gitea/custom:z
    ports:
      - "127.0.0.1:7002:3000" # TODO: How should we deal with ssh? Necessary?
    entrypoint: ["/bin/sh","-c"]
    command:
      - | # Will run every time on startup but commands are idempotent so no worries
        echo 'su-exec git /usr/local/bin/gitea migrate' >> /etc/s6/gitea/setup
        echo 'su-exec git /usr/local/bin/gitea admin user create --username '${GITEA_ADMIN}' --password '${GITEA_ADMIN_PASSWORD}' --email admin@local --admin --must-change-password=false' >> /etc/s6/gitea/setup
        /usr/bin/entrypoint /usr/bin/s6-svscan /etc/s6
    depends_on:
      gitea_db:
        condition: service_healthy
      minio:
        condition: service_healthy
  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=internal
      - MINIO_ROOT_PASSWORD=1ts0ktob3ins3cure
      - MINIO_BROWSER_REDIRECT_URL=http://127.0.0.1:7003
    ports:
      - "127.0.0.1:7003:9001"
    # volumes:
      # Uncomment when necessary
      # - ./data/minio:/data:Z
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
  gitea_db:
    image: docker.io/library/postgres:18
    restart: always
    environment:
      - POSTGRES_USER=gitea # TODO: Use environment variables
      - POSTGRES_PASSWORD=gitea
      - POSTGRES_DB=gitea
    # volumes:
      # Uncomment when necessary
      # - ./data/postgres:/var/lib/postgresql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
