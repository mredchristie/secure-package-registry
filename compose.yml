services:
  rabbitmq:
    image: docker.io/rabbitmq:4-management
    ports:
      - "127.0.0.1:7001:15672"
      - "127.0.0.1:5672:5672" # For testing purposes. Comment out in prod.
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "admin"

  ## ---------- Local Gitea ----------
  ## Uncomment gitea + gitea_db (and comment out gitea-remote) to use a local
  ## Gitea instance. The entrypoint creates accounts, generates tokens, and
  ## seeds the gitea:config key in Valkey automatically.
  gitea:
    image: docker.gitea.com/gitea:1.25.4
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea_db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
      - GITEA__security__INSTALL_LOCK=true
      - GITEA_CUSTOM=/data/gitea/custom

    volumes:
      # Uncomment when necessary. No persistence necessary for testing phase
      # - ./data/gitea:/data:Z
      - ./infra/gitea-custom/:/data/gitea/custom:ro
    entrypoint: ["/bin/sh","-c"]
    command:
      - | # Will run every time on startup but commands are idempotent so no worries
        apk update
        apk add valkey-cli jq
        cat >> /etc/s6/gitea/setup << 'GITEA_SETUP'
        su-exec git /usr/local/bin/gitea migrate

        # Create admin account
        su-exec git /usr/local/bin/gitea admin user create \
          --username 'spr-admin' \
          --password 'spr-admin' \
          --email admin@local \
          --admin \
          --must-change-password=false

        # Create registry account (owns curated/approved packages)
        su-exec git /usr/local/bin/gitea admin user create \
          --username 'spr-registry' \
          --password 'spr-registry' \
          --email registry@local \
          --must-change-password=false

        # Create sandbox account (temporary packages during behavioral analysis)
        su-exec git /usr/local/bin/gitea admin user create \
          --username 'spr-sandbox' \
          --password 'spr-sandbox' \
          --email sandbox@local \
          --must-change-password=false

        # Generate access tokens for each account
        su-exec git /usr/local/bin/gitea admin user generate-access-token \
          --username 'spr-admin' \
          --token-name "spr-token" \
          --scopes "all" | sed "s/^.*: //" >/tmp/token-admin.txt

        su-exec git /usr/local/bin/gitea admin user generate-access-token \
          --username 'spr-registry' \
          --token-name "spr-token" \
          --scopes "all" | sed "s/^.*: //" >/tmp/token-registry.txt

        su-exec git /usr/local/bin/gitea admin user generate-access-token \
          --username 'spr-sandbox' \
          --token-name "spr-token" \
          --scopes "all" | sed "s/^.*: //" >/tmp/token-sandbox.txt

        # Build and store gitea:config as a single JSON entry in valkey
        # NOTE: $$ is required because podman-compose/docker-compose interpolates
        # $VARNAME in YAML values before the shell sees them. $$ produces a
        # literal $ in the rendered script.
        GITEA_CONFIG=$$(jq -nc \
          --arg admin_user "spr-admin" \
          --arg admin_token "$$(cat /tmp/token-admin.txt)" \
          --arg registry_user "spr-registry" \
          --arg registry_token "$$(cat /tmp/token-registry.txt)" \
          --arg sandbox_user "spr-sandbox" \
          --arg sandbox_token "$$(cat /tmp/token-sandbox.txt)" \
          '{
            "base_url": "http://gitea:3000",
            "accounts": {
              "admin":    { "username": $$admin_user,    "token": $$admin_token },
              "registry": { "username": $$registry_user, "token": $$registry_token },
              "sandbox":  { "username": $$sandbox_user,  "token": $$sandbox_token }
            }
          }')
        valkey-cli -h valkey -p 6379 SET gitea:config "$$GITEA_CONFIG" NX
        GITEA_SETUP
        /usr/bin/entrypoint /usr/bin/s6-svscan /etc/s6
    depends_on:
      gitea_db:
        condition: service_healthy
      minio:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -h valkey -p 6379 EXISTS gitea:config | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ## ---------- Remote Gitea ----------
  ## Seeds credentials from .env into the gitea:config Valkey key.
  ## Comment this out and uncomment the gitea + gitea_db services above
  ## to switch back to a local Gitea instance.
  # gitea-remote:
  #   image: docker.io/valkey/valkey:9.0.2-alpine
  #   depends_on:
  #     valkey:
  #       condition: service_healthy
  #   environment:
  #     - REMOTE_GITEA_BASE_URL=${REMOTE_GITEA_BASE_URL}
  #     - REMOTE_GITEA_ADMIN_USER=${REMOTE_GITEA_ADMIN_USER}
  #     - REMOTE_GITEA_ADMIN_TOKEN=${REMOTE_GITEA_ADMIN_TOKEN}
  #     - REMOTE_GITEA_REGISTRY_USER=${REMOTE_GITEA_REGISTRY_USER}
  #     - REMOTE_GITEA_REGISTRY_TOKEN=${REMOTE_GITEA_REGISTRY_TOKEN}
  #     - REMOTE_GITEA_SANDBOX_USER=${REMOTE_GITEA_SANDBOX_USER}
  #     - REMOTE_GITEA_SANDBOX_TOKEN=${REMOTE_GITEA_SANDBOX_TOKEN}
  #   entrypoint: ["/bin/sh", "-c"]
  #   # $$ escapes are required — podman-compose/docker-compose interpolates
  #   # $VARNAME in YAML values. $$ produces a literal $ in the rendered script.
  #   command:
  #     - |
  #       apk add --no-cache jq >/dev/null 2>&1
  #       GITEA_CONFIG=$$(jq -nc \
  #         --arg base_url "$$REMOTE_GITEA_BASE_URL" \
  #         --arg admin_user "$$REMOTE_GITEA_ADMIN_USER" \
  #         --arg admin_token "$$REMOTE_GITEA_ADMIN_TOKEN" \
  #         --arg registry_user "$$REMOTE_GITEA_REGISTRY_USER" \
  #         --arg registry_token "$$REMOTE_GITEA_REGISTRY_TOKEN" \
  #         --arg sandbox_user "$$REMOTE_GITEA_SANDBOX_USER" \
  #         --arg sandbox_token "$$REMOTE_GITEA_SANDBOX_TOKEN" \
  #         '{
  #           "base_url": $$base_url,
  #           "accounts": {
  #             "admin":    { "username": $$admin_user,    "token": $$admin_token },
  #             "registry": { "username": $$registry_user, "token": $$registry_token },
  #             "sandbox":  { "username": $$sandbox_user,  "token": $$sandbox_token }
  #           }
  #         }')
  #       valkey-cli -h valkey -p 6379 SET gitea:config "$$GITEA_CONFIG" NX
  #       echo "Remote Gitea config seeded into Valkey"

  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio_pass
      - MINIO_BROWSER_REDIRECT_URL=http://127.0.0.1:7003
    ports:
      - "127.0.0.1:7003:9001"
      - "127.0.0.1:9000:9000"
    # volumes:
      # Uncomment when necessary
      # - ./data/minio:/data:Z
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
  minio-init:
    image: docker.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/safe.jsonl:/seed/safe.jsonl:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set spr http://minio:9000 minio minio_pass
        mc mb --ignore-existing spr/behavior
        mc cp /seed/safe.jsonl spr/behavior/behavior/baseline/behavior.jsonl
        echo "Baseline seeded successfully"

  ## ---------- Local Gitea DB ----------
  ## Uncomment when using local Gitea (see above).
  gitea_db:
    image: docker.io/library/postgres:18
    restart: always
    environment:
      - POSTGRES_USER=gitea # TODO: Use environment variables
      - POSTGRES_PASSWORD=gitea
      - POSTGRES_DB=gitea
    # volumes:
      # Uncomment when necessary
      # - ./data/postgres:/var/lib/postgresql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: docker.io/valkey/valkey:9.0.2-alpine
    environment:
      - ALLOW_EMPTY_PASSWORD=true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # volumes:
      # Uncomment when necessary
      # - ./data/valkey:/data:Z
  core_db:
    image: docker.io/library/postgres:18
    restart: always
    environment:
      - POSTGRES_HOST=core_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=core
    # volumes:
      # Uncomment when necessary
      # - ./data/core_db:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d core -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  ## ---------- Local Gitea Registry Seed ----------
  ## Uncomment when using local Gitea (see above).
  seed-registry:
    image: docker.io/library/node:23-alpine
    entrypoint: ["/bin/sh","-c"]
    environment:
      # To use this container, you need to provide one, not really the kind of thing I can set a default for
      # A token has been saved as a repository secret
      - GH_TOKEN=${GITHUB_TOKEN}
    command:
      - |
        set -x
        apk add --no-cache curl valkey-cli github-cli tar jq

        # I believe there is some block on setting environment variables in the command: section of the compose file, so we will have to a temp file instead.
        while true; do
          valkey-cli -h valkey GET gitea:config | jq -r '.accounts.admin.token' > /tmp/gitea_token.txt
          if [ -s /tmp/gitea_token.txt ]; then
            break
          fi
          sleep 2
        done

        cat >> ~/.npmrc << NPMRC_SETUP
        registry=http://gitea:3000/api/packages/spr-admin/npm/
        //gitea:3000/api/packages/spr-admin/npm/:_authToken=$(cat /tmp/gitea_token.txt)
        always-auth=true
        NPMRC_SETUP

        cat ~/.npmrc

        mkdir -p /tmp/artifacts
        cd /tmp/artifacts
        gh run download 22155394248 --repo BenjyRead/Registry-Reproducible-Builds -n "svelte-5.48.2-build"
        ls

        tar -xzf svelte-5.48.2.tgz
        ls
        cd package

        npm config get registry

        npm publish

        cd ..
        mkdir pkg
        cd pkg

        npm pack is-number@6.0.0 --registry https://registry.npmjs.org
        tar -xzf is-number-6.0.0.tgz
        cd package

        npm publish

    depends_on:
      gitea:
        condition: service_healthy
      valkey:
        condition: service_healthy

  ## ---------- Database Seed ----------
  ## Uncomment when using local Gitea (see above).
  seed-db:
    build:
      context: .
      dockerfile: cmd/seed/Containerfile
    depends_on:
      core_db:
        condition: service_healthy
      spr:
        condition: service_healthy


  spr:
    build:
      context: .
      dockerfile: cmd/spr/Containerfile
    depends_on:
      core_db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      valkey:
        condition: service_healthy
      # For local Gitea: uncomment gitea, comment out gitea-remote
      gitea:
        condition: service_healthy
      # gitea-remote:
      #   condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - EXTERNAL_PORT=8080
      - INTERNAL_PORT=8081
      - DATABASE_URL=postgres://postgres:postgres@core_db:5432/core?sslmode=disable
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672/
      - VALKEY_URL=valkey:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio_pass
      - MINIO_BUCKET=behavior
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard-ui:
    build:
      context: ./dashboard-ui
      dockerfile: Containerfile
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    restart: unless-stopped

  home-ui:
    build:
      context: ./home-ui
      dockerfile: Containerfile
    ports:
      - '127.0.0.1:3001:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: docker.io/caddy:2-alpine
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - spr
      - dashboard-ui
    restart: unless-stopped

  poller:
    build:
      context: .
      dockerfile: cmd/poller/Containerfile
    environment:
      - DB_HOST=core_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=core
      - LOG_LEVEL=info
      - WORKER_COUNT=10
      - RATE_LIMIT_RPS=0.28
      - ECOSYSTEM=npm
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=admin
    depends_on:
      core_db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped

  gitea-reverse-proxy:
    ports:
      - "127.0.0.1:7002:7002"
    build:
      context: .
      dockerfile: cmd/reg-proxy/Containerfile
    depends_on:
      # spr:
      #   condition: service_healthy
      core_db:
        condition: service_healthy

