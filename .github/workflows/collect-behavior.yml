name: Collect Package Behavior

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name'
        required: true
      version:
        description: 'Package version'
        required: true
      registry:
        description: 'Registry type (npm or gitea)'
        required: true
        default: 'npm'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tracee
        run: |
          wget -q https://github.com/aquasecurity/tracee/releases/download/v0.22.0/tracee-x86_64.tar.gz
          tar -xzf tracee-x86_64.tar.gz
          sudo mv tracee /usr/local/bin/tracee
          sudo chmod +x /usr/local/bin/tracee

      - name: Create package directory
        run: mkdir -p /tmp/pkg-test

      - name: Install package
        working-directory: /tmp/pkg-test
        run: |
          npm init -y
          npm install ${{ github.event.inputs.package }}@${{ github.event.inputs.version }}

      - name: Run behavioral analysis with Tracee
        run: |
          sudo tracee \
            --output json \
            --output option:parse-arguments \
            --scope container=new \
            --events openat,execve,connect,bind,socket,write,read \
            --output file:/tmp/behavior.jsonl &
          TRACEE_PID=$!
          sleep 3
          cd /tmp/pkg-test
          node -e "try { require('${{ github.event.inputs.package }}') } catch(e) { console.log('Import error:', e.message) }" || true
          sleep 5
          sudo kill $TRACEE_PID || true
          sudo chown $USER /tmp/behavior.jsonl || true

      - name: Upload behavior artifact
        uses: actions/upload-artifact@v4
        with:
          name: behavior-${{ github.event.inputs.package }}-${{ github.event.inputs.version }}
          path: /tmp/behavior.jsonl
          retention-days: 7
