name: Collect Package Behavior

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name'
        required: true
      version:
        description: 'Package version'
        required: true
      registry:
        description: 'Registry type (npm or gitea)'
        required: true
        default: 'npm'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sanitize artifact name
        id: sanitize
        run: |
          SAFE_NAME=$(echo "${{ github.event.inputs.package }}" | tr '/@:' '---')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Create package directory
        run: |
          mkdir -p /tmp/pkg-test /tmp/tracee-out
          chmod 777 /tmp/tracee-out
          cd /tmp/pkg-test
          npm init -y

      - name: Start Tracee
        run: |
          docker run --detach --name tracee \
            --pid=host --cgroupns=host --privileged \
            -v /etc/os-release:/etc/os-release-host:ro \
            -v /tmp/tracee-out:/out \
            aquasec/tracee:0.24.1 \
            --output json:/out/behavior.jsonl \
            --output option:parse-arguments \
            --events execve,openat,connect,net_packet_dns_request,net_packet_dns_response
          # Wait until Tracee has attached its probes and created the output
          # file, so the npm install below is fully inside the trace window.
          for i in $(seq 1 60); do
            if sudo test -f /tmp/tracee-out/behavior.jsonl; then
              echo "Tracee output file present after $((i*2))s"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' tracee)" != "true" ]; then
              echo "Tracee container exited early:"
              docker logs tracee
              break
            fi
            sleep 2
          done
          sleep 5

      - name: Install and exercise package (traced)
        working-directory: /tmp/pkg-test
        run: |
          npm install "${{ github.event.inputs.package }}@${{ github.event.inputs.version }}"
          timeout 10 node -e "try { require('${{ github.event.inputs.package }}') } catch(e) { console.log('Import error:', e.message) }" || true
          sleep 5

      - name: Stop Tracee and collect output
        run: |
          docker stop -t 15 tracee || true
          sudo chown "$USER" /tmp/tracee-out/behavior.jsonl 2>/dev/null || true
          if [ ! -s /tmp/tracee-out/behavior.jsonl ]; then
            echo "WARNING: Tracee produced no events; uploading placeholder"
            docker logs tracee || true
            echo '{"timestamp":0,"eventName":"placeholder","processName":"node","args":[]}' > /tmp/tracee-out/behavior.jsonl
          fi
          wc -l /tmp/tracee-out/behavior.jsonl

      - name: Upload behavior artifact
        uses: actions/upload-artifact@v4
        with:
          name: behavior-${{ steps.sanitize.outputs.safe_name }}-${{ github.event.inputs.version }}
          path: /tmp/tracee-out/behavior.jsonl
          retention-days: 7
