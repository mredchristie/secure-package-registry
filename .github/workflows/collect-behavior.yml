name: Collect Package Behavior

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name'
        required: true
      version:
        description: 'Package version'
        required: true
      registry:
        description: 'Registry type (npm or gitea)'
        required: true
        default: 'npm'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sanitize artifact name
        id: sanitize
        run: |
          SAFE_NAME=$(echo "${{ github.event.inputs.package }}" | tr '/@:' '---')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Install Tracee via apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apt-transport-https gnupg
          curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/aquasecurity.gpg
          echo "deb [signed-by=/usr/share/keyrings/aquasecurity.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/aquasecurity.list
          sudo apt-get update -qq
          sudo apt-get install -y tracee || true

      - name: Create package directory
        run: mkdir -p /tmp/pkg-test

      - name: Install package
        working-directory: /tmp/pkg-test
        run: |
          npm init -y
          npm install ${{ github.event.inputs.package }}@${{ github.event.inputs.version }}

      - name: Run behavioral analysis
        run: |
          touch /tmp/behavior.jsonl
          if command -v tracee &> /dev/null; then
            sudo tracee \
              --output json \
              --output option:parse-arguments \
              --events openat,execve,connect,bind,socket,write,read \
              --output file:/tmp/behavior.jsonl &
            TRACEE_PID=$!
            sleep 3
          fi
          
          cd /tmp/pkg-test
          timeout 10 node -e "try { require('${{ github.event.inputs.package }}') } catch(e) { console.log('Import error:', e.message) }" || true
          
          sleep 5
          sudo kill $TRACEE_PID 2>/dev/null || true
          sudo chown $USER /tmp/behavior.jsonl 2>/dev/null || true
          
          if [ ! -s /tmp/behavior.jsonl ]; then
            echo '{"timestamp":0,"eventName":"placeholder","processName":"node","args":[]}' > /tmp/behavior.jsonl
          fi

      - name: Upload behavior artifact
        uses: actions/upload-artifact@v4
        with:
          name: behavior-${{ steps.sanitize.outputs.safe_name }}-${{ github.event.inputs.version }}
          path: /tmp/behavior.jsonl
          retention-days: 7
