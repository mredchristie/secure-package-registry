version: "2"

runner:
  issues:
    max-issues-per-linter: 50
    max-same-issues: 3
    new-from-rev: HEAD~1

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable-all: true
  # disable:
  #   - exhaustruct
  #   - gochecknoglobals
  #   - gochecknoinits
  #   - gomnd
  #   - lll
  #   - varnamelen
  #   - wrapcheck
  #   - wsl

linters-settings:
  gofumpt:
    lang-version: "1.21"
    extra-rules: true

  revive:
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck
          - sayRepetitiveInsteadOfStutters
      - name: var-naming
        arguments:
          - allow list="Id" "Idempotent" "Url" "Vm" "X509" "Ssh"
      - name: package-comments
        arguments:
          - keepTopLevel

  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    check-shadowing: true
    enable-all: true

  staticcheck:
    go: "1.21"

  unused:
    go: "1.21"

  gci:
    local-prefixes: git.duti.dev/acheong08/secure-package-registry

  dupword:
    enabled: true

  context-check:
    enabled: true

  misspell:
    locale: US

  whitespace:
    multi-func: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - funlen
        - gosec
        - lll
        - testpackage
